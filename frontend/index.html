<style>
:root{--g:#103b29;--g2:#174b34;--lime:#e5f0d3;--accent:#a6d84b;--ink:#17221c;--muted:#6b756f;--line:#e7eae6;--bg:#f6f8f5;--white:#fff;--red:#b42318;--shadow:0 5px 18px #173b2609}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:220px;background:linear-gradient(180deg,#103b29,#082a1d);color:#fff;padding:23px 14px;display:flex;flex-direction:column;z-index:20}.brand{text-align:center;padding:4px 8px 28px}.leaf{color:var(--accent);font-size:25px}.brand-name{font:700 28px Georgia,serif}.brand small{display:block;font-size:9px;letter-spacing:4px;color:#dce8de;margin-top:6px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#e8f0ea;display:flex;align-items:center;gap:13px;padding:13px;border-radius:9px;text-align:left}.nav button.active{background:var(--lime);color:var(--g);font-weight:700}.nav button:hover:not(.active){background:#ffffff12}.ico{width:20px;text-align:center;font-size:17px}.sidefoot{margin-top:auto;padding:20px 8px 0;font:18px/1.25 Georgia,serif;color:#d7e5d8}.sidefoot:after{content:"";display:block;width:34px;height:4px;border-radius:9px;background:var(--accent);margin-top:12px}main{margin-left:220px;min-width:0}.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:10}.search{width:min(460px,55%);background:#f2f3f1;border-radius:28px;padding:11px 15px;display:flex;gap:10px}.search input{border:0;outline:0;background:transparent;width:100%}.top-right{display:flex;align-items:center;gap:12px}.profilebtn{display:flex;align-items:center;gap:10px;border:0;background:transparent}.avatar{width:35px;height:35px;background:var(--g);color:#fff;border-radius:50%;display:grid;place-items:center;font-weight:750}.mobile-menu{display:none}.content{padding:0 25px 34px;max-width:1800px;margin:auto}.hero{height:235px;margin:0 -25px 20px;position:relative;background:linear-gradient(90deg,#052418d9,#05241835),url('https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1800&q=85') center/cover;display:flex;align-items:center;padding:38px 42px;color:#fff}.eyebrow{font-size:11px;letter-spacing:3px;color:#c4ed4c;margin-bottom:12px}.hero h1{font:700 clamp(34px,4vw,56px)/1.02 Georgia,serif;margin:0 0 12px}.hero h1 span{color:#b3df49}.hero p{margin:0;max-width:460px;line-height:1.5}.page-title{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:24px 0 18px}.page-title h1{margin:0;font-size:29px;letter-spacing:-.7px}.page-title p{margin:5px 0 0;color:var(--muted)}.primary{background:var(--g);color:white;border:0;border-radius:9px;padding:11px 16px;font-weight:700}.primary:hover{background:#20553a}.secondary{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:8px}.danger{color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}.metric{border-radius:12px;padding:17px;display:flex;align-items:center;gap:12px;min-width:0}.metric:nth-child(1){background:#f0f6e9}.metric:nth-child(2){background:#fbf4e9}.metric:nth-child(3){background:#eef4f8}.metric:nth-child(4){background:#fbf1e6}.metric-icon{width:43px;height:43px;flex:0 0 43px;border-radius:50%;display:grid;place-items:center;background:#ffffffbb;font-size:19px}.metric-label{font-size:12px;color:#505b54;margin-bottom:6px}.metric-value{font-size:clamp(16px,1.5vw,23px);font-weight:800;overflow-wrap:anywhere}.metric-sub{font-size:11px;color:var(--muted);margin-top:5px}.section-head,.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px}.section-head h2{font-size:20px;margin:0}.panel{background:#fff;border:1px solid #edf0ec;border-radius:12px;padding:15px;min-width:0;box-shadow:var(--shadow)}.panel-head{margin:0 0 13px}.panel-head h3{font-size:15px;margin:0}.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.product-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);min-width:0}.product-img{height:142px;background:#e8eee7;display:grid;place-items:center;overflow:hidden}.product-img img{width:100%;height:100%;object-fit:cover}.no-img{font-size:34px;color:#66816d}.product-body{padding:13px}.product-body h3{font-size:15px;margin:0 0 5px}.muted{color:var(--muted)}.small{font-size:12px}.product-prices{display:flex;justify-content:space-between;gap:8px;margin:12px 0;font-size:12px}.product-prices strong{display:block;font-size:14px;margin-top:4px}.card-actions{display:flex;gap:7px}.card-actions button{flex:1}.stock-tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#edf5e5;color:#24582e;font-size:11px}.stock-tag.low{background:#fff4d8;color:#986500}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th{background:#f4f5f3;color:#515b55;text-align:left;font-weight:650;padding:11px 10px}td{padding:11px 10px;border-bottom:1px solid #edf0ec}tr:last-child td{border-bottom:0}.tag{display:inline-block;border-radius:20px;padding:4px 9px;font-size:11px}.tag.Purchase{background:#eaf4df;color:#29572e}.tag.Sale{background:#eaf1f8;color:#27527c}.tag.Expense{background:#fce9e7;color:#9a3027}.filters{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.field{border:1px solid var(--line);border-radius:8px;background:white;padding:10px 11px;min-width:0;outline-color:#9ac75e}.filters .field{flex:1;min-width:145px}.stock-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.stock-card{padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.stock-card-head{display:flex;align-items:center;gap:10px}.stock-thumb{width:54px;height:54px;border-radius:9px;overflow:hidden;background:#e9efe7;flex:0 0 54px;display:grid;place-items:center}.stock-thumb img{width:100%;height:100%;object-fit:cover}.stock-card h3{font-size:14px;margin:0 0 5px}.stock-qty{font-size:24px;font-weight:800;margin:14px 0 2px}.stock-meta{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;display:flex;justify-content:space-between;font-size:12px;gap:8px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.empty{padding:35px 15px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d6ddd5;border-radius:12px}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.notice{padding:12px 14px;border-radius:9px;background:#fff6df;color:#77530a;font-size:12px;margin:12px 0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-field label{display:block;font-size:12px;color:#5d685f;margin-bottom:6px}.form-field input,.form-field select,.form-field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff}.form-field.full{grid-column:1/-1}.form-field textarea{min-height:80px;resize:vertical}.modal-backdrop{position:fixed;inset:0;background:#081d13a8;display:grid;place-items:center;padding:18px;z-index:50;overflow:auto}.modal{background:white;border-radius:16px;padding:22px;width:min(620px,100%);max-height:94vh;overflow:auto;box-shadow:0 20px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:21px}.close{border:0;background:#f1f3ef;border-radius:50%;width:34px;height:34px;font-size:19px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;bottom:22px;right:22px;background:var(--g);color:white;padding:13px 18px;border-radius:10px;z-index:70;max-width:min(450px,90vw);box-shadow:var(--shadow)}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(120deg,#e8f0e5,#f8f8f4)}.login{width:min(420px,100%);background:#fff;padding:30px;border-radius:18px;box-shadow:0 12px 50px #173b2617}.login h1{font:700 30px Georgia,serif;color:var(--g);margin:0}.login p{color:var(--muted);line-height:1.5}.login .form-field{margin:14px 0}.login .primary{width:100%;margin-top:10px}.error{color:var(--red);font-size:12px;margin-top:10px}.history-up{color:#16733a}.history-down{color:#b42318}.muted-note{font-size:12px;color:var(--muted);line-height:1.5}
@media(max-width:1200px){.metrics{grid-template-columns:repeat(2,1fr)}.product-grid,.stock-grid{grid-template-columns:repeat(3,1fr)}.two-col{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:transform .2s;width:245px;box-shadow:15px 0 35px #0002}.sidebar.open{transform:translateX(0)}main{margin-left:0}.mobile-menu{display:block;border:0;background:transparent;font-size:22px}.topbar{height:60px;padding:0 13px;gap:10px}.search{width:auto;flex:1;padding:10px 12px}.top-right{gap:7px}.profile-name{display:none}.content{padding:0 14px 24px}.hero{margin:0 -14px 15px;height:225px;padding:24px}.hero h1{font-size:38px}.metrics{gap:8px}.metric{padding:12px 10px;gap:8px}.metric-icon{width:34px;height:34px;flex-basis:34px}.metric-value{font-size:16px}.product-grid,.stock-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product-img{height:120px}.product-body{padding:10px}.page-title{padding:19px 0 15px;align-items:flex-start}.page-title h1{font-size:25px}.page-title p{font-size:12px;line-height:1.4}.primary{padding:10px 12px;white-space:nowrap;font-size:12px}.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}.panel{padding:11px}.two-col{grid-template-columns:1fr}}
@media(max-width:390px){.metrics{grid-template-columns:1fr 1fr}.metric{display:block}.metric-icon{margin-bottom:7px}.product-grid,.stock-grid{grid-template-columns:1fr 1fr}.product-img{height:100px}.hero h1{font-size:32px}.top-right .signout{display:none}}
</style>
</head>
<body>
<div id="root"><div class="login-wrap"><div class="login"><h1>Hillsgoods</h1><p>Loading your trading workspace…</p></div></div></div>
<div id="modalRoot"></div>
<script>
const API = "https://hillsgoods-api.onrender.com";
const TOKEN_KEY = "hillsgoods_session_token";
const state = { user:null, page:"dashboard", products:[], transactions:[], rates:[], summary:null, query:"", txTab:"All", period:"month", loading:false };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const num = n => Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const dateOnly = d => new Date(d).toISOString().slice(0,10);
const displayDate = d => d ? new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) : "—";
async function api(path, opts={}) {
 const headers={...(opts.body?{"Content-Type":"application/json"}:{}),...(opts.headers||{})};
 const token=sessionStorage.getItem(TOKEN_KEY); if(token) headers.Authorization="Bearer "+token;
 const r=await fetch(API+path,{...opts,headers});
 const data=await r.json().catch(()=>({}));
 if(!r.ok) throw new Error(data.error||`Request failed (${r.status})`);
 return data;
}
function toast(s){const el=document.createElement("div");el.className="toast";el.textContent=s;document.body.appendChild(el);setTimeout(()=>el.remove(),3500)}
function errToast(e){toast(e.message||String(e))}
function imageHTML(p, cls=""){return p.imageUrl?`<img class="${cls}" src="${esc(p.imageUrl)}" alt="${esc(p.name)}" onerror="this.style.display='none'">`:`<span class="no-img">⬡</span>`}
function pageTitle(title,sub,button=""){return `<div class="page-title"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}
function metric(icon,label,value,sub=""){return `<div class="metric"><div class="metric-icon">${icon}</div><div><div class="metric-label">${label}</div><div class="metric-value">${value}</div>${sub?`<div class="metric-sub">${sub}</div>`:""}</div></div>`}
function noData(title,sub){return `<div class="empty"><strong>${title}</strong>${sub}</div>`}
function nav(){return `<aside class="sidebar" id="sidebar"><div class="brand"><span class="leaf">◢</span><div class="brand-name">Hillsgoods</div><small>MALAMCHIRAKK</small></div><nav class="nav">
${[["dashboard","⌂","Dashboard"],["products","⬡","Products"],["rates","↗","Current Rates"],["transactions","⇄","Transactions"],["stock","▣","Stock"],["settings","⚙","Settings"]].map(([id,ico,name])=>`<button data-page="${id}" class="${state.page===id?"active":""}"><span class="ico">${ico}</span>${name}</button>`).join("")}
</nav><div class="sidefoot">Natural Trade<br>from Malamchirakk</div></aside>`}
function shell(content){$("#root").innerHTML=`<div class="app">${nav()}<main><header class="topbar"><button class="mobile-menu" id="menuBtn">☰</button><div class="search">⌕ <input id="globalSearch" placeholder="Search products and transactions…" value="${esc(state.query)}"></div><div class="top-right"><button class="profilebtn" id="profileJump"><span class="avatar">${esc((state.user?.name||state.user?.email||"U").slice(0,1).toUpperCase())}</span><span class="profile-name">${esc(state.user?.name||state.user?.email||"User")}</span>⌄</button><button class="secondary signout" id="signOut">Sign out</button></div></header><div class="content">${content}</div></main></div>`;
 $("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("open");
 $("#signOut").onclick=()=>{sessionStorage.removeItem(TOKEN_KEY);state.user=null;loginView()};
 $("#profileJump").onclick=()=>go("settings");
 $("#globalSearch").oninput=e=>{state.query=e.target.value;if(state.page==="products")render();};
 document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));
}
function loginView(){ $("#root").innerHTML=`<div class="login-wrap"><form class="login" id="loginForm"><h1>Hillsgoods</h1><p>Sign in to manage products, daily rates, purchases, sales and stock.</p><div class="form-field"><label>Email</label><input name="email" type="email" required autocomplete="username"></div><div class="form-field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="primary" type="submit">Sign in</button><div id="loginError" class="error"></div><p class="muted-note">First-time setup must be completed securely through the backend setup endpoint.</p></form></div>`;
 $("#loginForm").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{const data=await api("/api/login",{method:"POST",body:JSON.stringify(f)});sessionStorage.setItem(TOKEN_KEY,data.token);state.user=data.user;await loadAll();render()}catch(err){$("#loginError").textContent=err.message}};
}
async function loadAll(){const [user,products,transactions,rates,summary]=await Promise.all([api("/api/me"),api("/api/products"),api("/api/transactions"),api("/api/rates"),api("/api/summary")]);state.user=user;state.products=products;state.transactions=transactions;state.rates=rates;state.summary=summary}
async function refresh(){await loadAll();render()}
function go(p){state.page=p;$("#sidebar")?.classList.remove("open");render()}
function render(){if(!sessionStorage.getItem(TOKEN_KEY)){loginView();return}let html="";
if(state.page==="dashboard")html=dashboard();
if(state.page==="products")html=productsPage();
if(state.page==="rates")html=ratesPage();
if(state.page==="transactions")html=transactionsPage();
if(state.page==="stock")html=stockPage();
if(state.page==="settings")html=settingsPage();
shell(html);wirePage()}
function dashboard(){
 const s=state.summary||{}, tx=state.transactions, has=tx.length>0;
 const todays=tx.filter(t=>dateOnly(t.date)===dateOnly(new Date()));
 const todaySales=todays.filter(t=>t.type==="Sale").reduce((a,t)=>a+t.amount,0);
 const todayProfit=todays.filter(t=>t.type==="Sale").reduce((a,t)=>a+(t.grossProfit||0),0);
 const thisMonth=tx.filter(t=>new Date(t.date).getMonth()===new Date().getMonth()&&new Date(t.date).getFullYear()===new Date().getFullYear());
 const monthlySales=thisMonth.filter(t=>t.type==="Sale").reduce((a,t)=>a+t.amount,0);
 const monthlyProfit=thisMonth.filter(t=>t.type==="Sale").reduce((a,t)=>a+(t.grossProfit||0),0);
 const recent=tx.slice(0,7);
 return `<section class="hero"><div><div class="eyebrow">HILLSGOODS · MALAMCHIRAKK</div><h1>Natural Trade<br>from <span>Our Hills</span></h1><p>Track your real products, daily market rates, stock, and trading performance.</p></div></section>
 <div class="metrics">${metric("⬡","Products",state.products.length,"Products entered by you")}${metric("↗","Today's Sales",money(todaySales),todays.length?`${todays.length} transactions today`:"No sales recorded today")}${metric("₹","Today's Gross Profit",money(todayProfit),todays.some(t=>t.type==="Sale")?"Calculated from recorded cost":"No sales data yet")}${metric("▣","Stock at Cost",money(s.stockValueAtCost||0),`${num(s.totalStockUnits||0)} total units`)}</div>
 <div class="two-col"><section class="panel"><div class="panel-head"><h3>Monthly performance</h3><span class="muted small">${new Date().toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</span></div>
 <div class="metrics" style="grid-template-columns:1fr 1fr;margin:0">${metric("↗","Sales",money(monthlySales),thisMonth.filter(t=>t.type==="Sale").length+" sales")}${metric("₹","Gross Profit",money(monthlyProfit),thisMonth.some(t=>t.type==="Sale")?"Based on cost of goods sold":"Not enough data yet")}</div>
 ${!has?`<div class="notice">No transactions recorded yet. Add a purchase first, then record sales to calculate real profit.</div>`:""}
 <p class="muted-note">Monthly figures are based only on records currently saved. Previous months and years will appear when you have data for those periods.</p></section>
 <section class="panel"><div class="panel-head"><h3>Low stock</h3><button class="secondary" data-page="stock">View stock</button></div>
 ${state.products.filter(p=>p.stock<=p.lowStockThreshold).length?state.products.filter(p=>p.stock<=p.lowStockThreshold).map(p=>`<div class="stock-meta"><span>${esc(p.name)}</span><strong>${num(p.stock)} ${esc(p.unit)}</strong></div>`).join(""):noData("No low-stock alerts","Products will appear here when stock reaches their threshold.")}</section></div>
 <div class="section-head"><h2>Recent transactions</h2><button class="secondary" data-page="transactions">View all</button></div>
 ${recent.length?transactionTable(recent):noData("No transactions yet","Create a purchase or sales invoice to start building your reports.")}`;
}
function productFiltered(){const q=state.query.toLowerCase();return state.products.filter(p=>`${p.name} ${p.category}`.toLowerCase().includes(q))}
function productsPage(){return `${pageTitle("Products","Add products, upload their images, and manage units and prices.",`<button class="primary" data-action="product">+ Add product</button>`)}
 <div class="filters"><input class="field" id="productSearch" placeholder="Search products…" value="${esc(state.query)}"><select class="field" id="productCategory"><option value="">All categories</option>${[...new Set(state.products.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
 <div id="productCards" class="product-grid">${productCards(productFiltered())}</div>`}
function productCards(items){if(!items.length)return noData("No products yet","Add your first product and upload its image.");return items.map(p=>`<article class="product-card"><div class="product-img">${imageHTML(p)}</div><div class="product-body"><h3>${esc(p.name)}</h3><div class="small muted">${esc(p.category)} · ${esc(p.unit)}</div><div class="product-prices"><div>Buying<strong>${money(p.purchaseRate)}</strong></div><div>Selling<strong>${money(p.salesRate)}</strong></div></div><div class="stock-meta"><span>Stock: <b>${num(p.stock)} ${esc(p.unit)}</b></span><span class="stock-tag ${p.stock<=p.lowStockThreshold?"low":""}">${p.stock<=p.lowStockThreshold?"Low stock":"In stock"}</span></div><div class="card-actions" style="margin-top:12px"><button class="secondary" data-edit-product="${p._id}">Edit</button><button class="secondary danger" data-archive="${p._id}">Archive</button></div></div></article>`).join("")}
function ratesPage(){return `${pageTitle("Current Rates","Update market prices daily. Every saved change keeps a dated rate history.",`<button class="primary" data-action="rates">Update rates</button>`)}
 <div class="panel"><div class="panel-head"><h3>Current market and trading rates</h3><span class="muted small">Latest saved values</span></div>
 ${state.products.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Market rate</th><th>Buying price</th><th>Selling price</th><th>Last updated</th><th></th></tr></thead><tbody>${state.products.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="muted small">${esc(p.unit)}</div></td><td>${money(p.currentMarketRate||0)}</td><td>${money(p.purchaseRate)}</td><td>${money(p.salesRate)}</td><td>${p.rateUpdatedAt?displayDate(p.rateUpdatedAt):"Not updated"}</td><td><button class="secondary" data-edit-rate="${p._id}">Edit rates</button></td></tr>`).join("")}</tbody></table></div>`:noData("No products","Add products first to start recording their market rates.")}</div>
 <div class="section-head"><h2>Rate history</h2></div><div class="panel">${state.rates.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Product</th><th>Market rate</th><th>Buying price</th><th>Selling price</th><th>Note</th></tr></thead><tbody>${state.rates.slice(0,100).map(r=>`<tr><td>${displayDate(r.date)}</td><td>${esc(r.productName)}</td><td>${money(r.marketRate)}</td><td>${money(r.purchaseRate)}</td><td>${money(r.salesRate)}</td><td>${esc(r.note||"—")}</td></tr>`).join("")}</tbody></table></div>`:noData("No rate history yet","Changes will appear here after you save daily rates.")}</div>`}
function transactionsPage(){const tx=state.transactions.filter(t=>(state.txTab==="All"||t.type===state.txTab)&&`${t.productName} ${t.party} ${t.type} ${t.invoiceNo||""}`.toLowerCase().includes(state.query.toLowerCase()));const sales=tx.filter(t=>t.type==="Sale");return `${pageTitle("Transactions","Create purchase and sales invoices and review your trading performance.",`<button class="primary" data-action="transaction">+ New invoice</button>`)}
 <div class="metrics">${metric("↗","Sales",money(sales.reduce((a,t)=>a+t.amount,0)),sales.length+" records")}${metric("₹","Gross profit",money(sales.reduce((a,t)=>a+(t.grossProfit||0),0)),sales.length?"Cost of goods sold deducted":"No sales in this view")}${metric("▣","Purchases",money(tx.filter(t=>t.type==="Purchase").reduce((a,t)=>a+t.amount,0)),tx.filter(t=>t.type==="Purchase").length+" records")}${metric("⇄","Records",tx.length,"Matching transactions")}</div>
 <div class="panel"><div class="panel-head"><h3>Invoices and transactions</h3><span class="muted small">${tx.length} records</span></div><div class="filters">${["All","Sale","Purchase","Expense"].map(t=>`<button class="${state.txTab===t?"primary":"secondary"}" data-txtab="${t}">${t==="All"?"All transactions":t==="Sale"?"Sales":t==="Purchase"?"Purchases":"Expenses"}</button>`).join("")}</div>${tx.length?transactionTable(tx):noData("No matching transactions","Create your first purchase or sales invoice.")}</div>`}
function transactionTable(items){return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Invoice</th><th>Type</th><th>Product / details</th><th>Party</th><th>Quantity</th><th>Rate</th><th>Amount</th><th>Gross profit</th></tr></thead><tbody>${items.map(t=>`<tr><td>${displayDate(t.date)}</td><td>${esc(t.invoiceNo||"—")}</td><td><span class="tag ${esc(t.type)}">${esc(t.type)}</span></td><td>${esc(t.productName)}</td><td>${esc(t.party||"—")}</td><td>${num(t.quantity)} ${esc(t.unit||"")}</td><td>${money(t.rate)}</td><td><b>${money(t.amount)}</b></td><td>${t.type==="Sale"?money(t.grossProfit||0):"—"}</td></tr>`).join("")}</tbody></table></div>`}
function stockPage(){return `${pageTitle("Stock","Live stock quantities and value at recorded average purchase cost.",`<button class="primary" data-action="transaction">+ Stock movement</button>`)}
 <div class="metrics">${metric("⬡","Products",state.products.length)}${metric("▣","Units in stock",num(state.products.reduce((a,p)=>a+p.stock,0)))}${metric("₹","Stock value",money(state.summary?.stockValueAtCost||0),"Average cost basis")}${metric("!","Low stock",state.products.filter(p=>p.stock<=p.lowStockThreshold).length,"At or below threshold")}</div>
 <div class="stock-grid">${state.products.length?state.products.map(p=>`<article class="stock-card"><div class="stock-card-head"><div class="stock-thumb">${imageHTML(p)}</div><div><h3>${esc(p.name)}</h3><span class="stock-tag ${p.stock<=p.lowStockThreshold?"low":""}">${p.stock<=p.lowStockThreshold?"Low stock":"In stock"}</span></div></div><div class="stock-qty">${num(p.stock)} <span class="small muted">${esc(p.unit)}</span></div><div class="muted small">Current stock quantity</div><div class="stock-meta"><span>Avg. cost / ${esc(p.unit)}</span><b>${money(p.averageCost||p.purchaseRate)}</b></div><div class="stock-meta"><span>Stock value</span><b>${money(p.stock*(p.averageCost||p.purchaseRate))}</b></div></article>`).join(""):noData("No stock yet","Add a product or record a purchase to build your stock.")}</div>`}
function settingsPage(){return `${pageTitle("Settings","Update your profile, business details, and login password.")}
 <div class="two-col"><section class="panel"><div class="panel-head"><h3>Your profile</h3></div><form id="profileForm" class="form-grid"><div class="form-field full"><label>Display name</label><input name="name" required value="${esc(state.user?.name||"")}"></div><div class="form-field full"><label>Email address</label><input name="email" type="email" required value="${esc(state.user?.email||"")}"></div><div class="form-field full"><label>Business name</label><input name="businessName" value="${esc(state.user?.businessName||"Hillsgoods")}"></div><div class="form-field full"><label>Business tagline / location</label><input name="businessTagline" value="${esc(state.user?.businessTagline||"Malamchirakk")}"></div><div class="form-field full"><button class="primary">Save profile</button></div></form></section>
 <section class="panel"><div class="panel-head"><h3>Change password</h3></div><form id="passwordForm" class="form-grid"><div class="form-field full"><label>Current password</label><input name="currentPassword" type="password" required autocomplete="current-password"></div><div class="form-field full"><label>New password (minimum 12 characters)</label><input name="newPassword" type="password" required minlength="12" autocomplete="new-password"></div><div class="form-field full"><label>Confirm new password</label><input name="confirmPassword" type="password" required minlength="12" autocomplete="new-password"></div><div class="form-field full"><button class="primary">Change password</button></div></form><p class="muted-note">Never share your password. Sign out when using a shared computer.</p></section></div>
 <div class="section-head"><h2>Data setup</h2></div><div class="panel"><p class="muted-note">This application starts with an empty product catalogue. Add your actual products and record real transactions; the dashboard and reports calculate from those saved records. Existing sample data is not imported.</p><p class="muted-note">User management is currently limited to the signed-in account profile and password. Creating additional staff logins should be enabled only after defining their roles and permissions.</p></div>`}
function wirePage(){
 $("#productSearch")?.addEventListener("input",e=>{state.query=e.target.value;$("#productCards").innerHTML=productCards(productFiltered())});
 $("#productCategory")?.addEventListener("change",e=>{const cat=e.target.value;$("#productCards").innerHTML=productCards(productFiltered().filter(p=>!cat||p.category===cat))});
 document.querySelectorAll("[data-txtab]").forEach(b=>b.onclick=()=>{state.txTab=b.dataset.txtab;render()});
 document.querySelectorAll("[data-edit-product]").forEach(b=>b.onclick=()=>productModal(state.products.find(p=>p._id===b.dataset.editProduct)));
 document.querySelectorAll("[data-archive]").forEach(b=>b.onclick=async()=>{if(confirm("Archive this product? It will be hidden from the active catalogue.")){try{await api("/api/products/"+b.dataset.archive,{method:"DELETE"});await refresh();toast("Product archived")}catch(e){errToast(e)}}});
 document.querySelectorAll("[data-edit-rate]").forEach(b=>b.onclick=()=>rateModal(state.products.find(p=>p._id===b.dataset.editRate)));
 document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{if(b.dataset.action==="product")productModal();if(b.dataset.action==="transaction")transactionModal();if(b.dataset.action==="rates")rateModal()});
 $("#profileForm")?.addEventListener("submit",async e=>{e.preventDefault();try{state.user=await api("/api/me",{method:"PATCH",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await refresh();toast("Profile updated")}catch(err){errToast(err)}});
 $("#passwordForm")?.addEventListener("submit",async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(d.newPassword!==d.confirmPassword)return toast("New passwords do not match.");try{await api("/api/me/password",{method:"PATCH",body:JSON.stringify({currentPassword:d.currentPassword,newPassword:d.newPassword})});e.target.reset();toast("Password changed")}catch(err){errToast(err)}});
}
function modal(title,body,onSubmit){$("#modalRoot").innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2><button class="close" id="closeModal">×</button></div>${body}</div></div>`;const close=()=>$("#modalRoot").innerHTML="";$("#closeModal").onclick=close;$("#modalBackdrop").onclick=e=>{if(e.target.id==="modalBackdrop")close()};const form=$("#modalForm");form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector("button[type=submit]");btn.disabled=true;try{await onSubmit(new FormData(form));close()}catch(err){errToast(err);btn.disabled=false}}}
function productModal(p=null){const body=`<form id="modalForm"><div class="form-grid"><div class="form-field full"><label>Product name</label><input name="name" required maxlength="120" value="${esc(p?.name||"")}"></div><div class="form-field"><label>Category</label><input name="category" required value="${esc(p?.category||"Agricultural products")}"></div><div class="form-field"><label>Unit</label><select name="unit">${["kg","liter","pcs"].map(u=>`<option ${p?.unit===u?"selected":""}>${u}</option>`).join("")}</select></div><div class="form-field"><label>Opening stock / current stock</label><input name="stock" type="number" min="0" step=".001" required value="${p?.stock??0}" ${p?"readonly":""}></div><div class="form-field"><label>Buying price (₹ per unit)</label><input name="purchaseRate" type="number" min="0" step=".01" required value="${p?.purchaseRate??0}"></div><div class="form-field"><label>Selling price (₹ per unit)</label><input name="salesRate" type="number" min="0" step=".01" required value="${p?.salesRate??0}"></div><div class="form-field"><label>Current market rate (₹)</label><input name="currentMarketRate" type="number" min="0" step=".01" value="${p?.currentMarketRate??0}"></div><div class="form-field"><label>Low-stock threshold</label><input name="lowStockThreshold" type="number" min="0" step=".001" value="${p?.lowStockThreshold??10}"></div><div class="form-field full"><label>Product image</label><input name="imageFile" type="file" accept="image/*"><div class="muted-note">Upload JPG, PNG or WebP up to 1 MB. The image is saved with this product.</div><input type="hidden" name="imageUrl" value="${esc(p?.imageUrl||"")}"></div></div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary" type="submit">${p?"Save changes":"Add product"}</button></div></form>`;
 modal(p?"Edit product":"Add product",body,async fd=>{const file=fd.get("imageFile");let imageUrl=fd.get("imageUrl");if(file&&file.size){if(file.size>1024*1024)throw new Error("Image must be 1 MB or smaller.");imageUrl=await fileToDataURL(file)}const data={name:fd.get("name"),category:fd.get("category"),unit:fd.get("unit"),purchaseRate:+fd.get("purchaseRate"),salesRate:+fd.get("salesRate"),currentMarketRate:+fd.get("currentMarketRate"),lowStockThreshold:+fd.get("lowStockThreshold"),imageUrl};if(!p)data.stock=+fd.get("stock");await api(p?"/api/products/"+p._id:"/api/products",{method:p?"PATCH":"POST",body:JSON.stringify(data)});await refresh();toast(p?"Product updated":"Product added")});
 $("#cancelModal").onclick=()=>$("#modalRoot").innerHTML="";
}
function rateModal(p=null){const list=p?[p]:state.products;if(!list.length){toast("Add a product first.");return}const body=`<form id="modalForm"><div class="form-field"><label>Product</label><select name="productId" id="rateProduct">${list.map(x=>`<option value="${x._id}">${esc(x.name)}</option>`).join("")}</select></div><div class="form-grid" style="margin-top:13px"><div class="form-field"><label>Today's market rate (₹ per unit)</label><input name="marketRate" type="number" min="0" step=".01" required value="${p?.currentMarketRate??0}"></div><div class="form-field"><label>New buying price (₹ per unit)</label><input name="purchaseRate" type="number" min="0" step=".01" required value="${p?.purchaseRate??0}"></div><div class="form-field"><label>New selling price (₹ per unit)</label><input name="salesRate" type="number" min="0" step=".01" required value="${p?.salesRate??0}"></div><div class="form-field"><label>Effective date</label><input name="date" type="date" required value="${dateOnly(new Date())}"></div><div class="form-field full"><label>Note (optional)</label><input name="note" maxlength="250" placeholder="Market change, supplier quote…"></div></div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary" type="submit">Save rates</button></div></form>`;
 modal(p?"Update product rates":"Update current rates",body,async fd=>{await api("/api/rates",{method:"POST",body:JSON.stringify({productId:fd.get("productId"),marketRate:+fd.get("marketRate"),purchaseRate:+fd.get("purchaseRate"),salesRate:+fd.get("salesRate"),date:fd.get("date"),note:fd.get("note")})});await refresh();toast("Rates saved with date history")});
 $("#cancelModal").onclick=()=>$("#modalRoot").innerHTML="";
}
function transactionModal(){if(!state.products.length){toast("Add a product before creating a purchase or sale.");return}const body=`<form id="modalForm"><div class="form-grid"><div class="form-field"><label>Invoice type</label><select name="type" id="txType"><option value="Purchase">Purchase invoice</option><option value="Sale">Sales invoice</option><option value="Expense">Expense</option></select></div><div class="form-field"><label>Date</label><input name="date" type="date" required value="${dateOnly(new Date())}"></div><div class="form-field full"><label>Product</label><select name="productId" id="txProduct">${state.products.map(p=>`<option value="${p._id}">${esc(p.name)} — stock ${num(p.stock)} ${esc(p.unit)}</option>`).join("")}<option value="">— Expense only —</option></select></div><div class="form-field"><label>Customer / supplier</label><input name="party" maxlength="160" placeholder="Name / company"></div><div class="form-field"><label>Quantity</label><input name="quantity" id="txQty" type="number" min=".001" step=".001" required value="1"></div><div class="form-field"><label>Unit</label><input id="txUnit" name="unit" readonly value="${esc(state.products[0].unit)}"></div><div class="form-field"><label>Rate per unit (₹)</label><input name="rate" id="txRate" type="number" min="0" step=".01" required value="${state.products[0].purchaseRate}"></div><div class="form-field"><label>Total amount (₹)</label><input name="amount" id="txAmount" type="number" min="0" step=".01" required value="${state.products[0].purchaseRate}"></div><div class="form-field full"><label>Notes</label><textarea name="notes" maxlength="1000"></textarea></div></div><div id="txHint" class="muted-note"></div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary" type="submit">Save invoice</button></div></form>`;
 modal("Create transaction invoice",body,async fd=>{const type=fd.get("type"),productId=fd.get("productId"),product=state.products.find(p=>p._id===productId);if(type!=="Expense"&&!product)throw new Error("Choose a product.");const data={type,date:fd.get("date"),productId:type==="Expense"?null:productId,productName:type==="Expense"?"Expense":product.name,party:fd.get("party"),quantity:type==="Expense"?0:+fd.get("quantity"),unit:type==="Expense"?"none":product.unit,rate:+fd.get("rate"),amount:+fd.get("amount"),notes:fd.get("notes")};await api("/api/transactions",{method:"POST",body:JSON.stringify(data)});await refresh();toast("Invoice saved and stock updated")});
 $("#cancelModal").onclick=()=>$("#modalRoot").innerHTML="";
 const sync=()=>{const type=$("#txType").value,id=$("#txProduct").value,p=state.products.find(x=>x._id===id);$("#txProduct").disabled=type==="Expense";$("#txQty").required=type!=="Expense";if(p){$("#txUnit").value=p.unit;if(!$("#txRate").dataset.touched)$("#txRate").value=type==="Sale"?p.salesRate:p.purchaseRate}else{$("#txUnit").value="none";$("#txRate").value=0}$("#txAmount").value=(+$("#txQty").value||0)*(+$("#txRate").value||0);$("#txHint").textContent=type==="Sale"&&p?`Available stock: ${num(p.stock)} ${p.unit}. Estimated gross profit uses average purchase cost.`:"Amount is quantity × rate. Expense records do not change product stock."};
 $("#txType").onchange=sync;$("#txProduct").onchange=()=>{delete $("#txRate").dataset.touched;sync()};$("#txQty").oninput=sync;$("#txRate").oninput=()=>{$("#txRate").dataset.touched="1";sync()};sync();
}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error("Could not read image."));r.readAsDataURL(file)})}
(async()=>{try{if(sessionStorage.getItem(TOKEN_KEY)){await loadAll();render()}else loginView()}catch(e){sessionStorage.removeItem(TOKEN_KEY);loginView();toast(e.message)}})();
</script>
</body></html>

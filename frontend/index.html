function translateMarkup(markup){if(state.user?.language!=="ml")return markup;for(const [en,ml] of Object.entries(mlText))markup=markup.split(en).join(ml);return markup;}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const num = n => Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const dateOnly = d => new Date(d).toISOString().slice(0,10);
const displayDate = d => d ? new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) : "—";
async function api(path, opts={}) {
 const headers={...(opts.body?{"Content-Type":"application/json"}:{}),...(opts.headers||{})};
 const token=sessionStorage.getItem(TOKEN_KEY); if(token) headers.Authorization="Bearer "+token;
 const r=await fetch(API+path,{...opts,headers});
 const data=await r.json().catch(()=>({}));
 if(!r.ok) throw new Error(data.error||`Request failed (${r.status})`);
 return data;
}
function toast(s){const el=document.createElement("div");el.className="toast";el.textContent=s;document.body.appendChild(el);setTimeout(()=>el.remove(),3500)}
function errToast(e){toast(e.message||String(e))}
function productName(p){const lang=state.user?.language||"en";return lang==="ml"?(p.nameMl||p.nameEn||p.name||""):(p.nameEn||p.name||p.nameMl||"")}
function imageHTML(p, cls=""){return p.imageUrl?`<img class="${cls}" src="${esc(p.imageUrl)}" alt="${esc(productName(p))}" onerror="this.style.display='none'">`:`<span class="no-img">⬡</span>`}
function pageTitle(title,sub,button=""){return `<div class="page-title"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}
function metric(icon,label,value,sub=""){return `<div class="metric"><div class="metric-icon">${icon}</div><div><div class="metric-label">${label}</div><div class="metric-value">${value}</div>${sub?`<div class="metric-sub">${sub}</div>`:""}</div></div>`}
function noData(title,sub){return `<div class="empty"><strong>${title}</strong>${sub}</div>`}
function nav(){return `<aside class="sidebar" id="sidebar"><div class="brand"><span class="leaf">◢</span><div class="brand-name">Hillsgoods</div><small>MALAMCHIRAKK</small></div><nav class="nav">
${[["dashboard","⌂","Dashboard"],["products","⬡","Products"],["rates","↗","Current Rates"],["transactions","⇄","Transactions"],["stock","▣","Stock"],["settings","⚙","Settings"]].map(([id,ico,name])=>`<button data-page="${id}" class="${state.page===id?"active":""}"><span class="ico">${ico}</span>${name}</button>`).join("")}
</nav><div class="sidefoot">Natural Trade<br>from Malamchirakk</div></aside>`}
function shell(content){$("#root").innerHTML=translateMarkup(`<div class="app">${nav()}<main><header class="topbar"><button class="mobile-menu" id="menuBtn">☰</button><div class="search">⌕ <input id="globalSearch" placeholder="Search products and transactions…" value="${esc(state.query)}"></div><div class="top-right"><select id="languageSelect" class="field" aria-label="Language" style="padding:8px"><option value="en" ${state.user?.language!=="ml"?"selected":""}>English</option><option value="ml" ${state.user?.language==="ml"?"selected":""}>മലയാളം</option></select><button class="profilebtn" id="profileJump"><span class="avatar">${esc((state.user?.name||state.user?.email||"U").slice(0,1).toUpperCase())}</span><span class="profile-name">${esc(state.user?.name||state.user?.email||"User")}</span></button></div></header><div class="content">${content}</div></main></div>`);
 $("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("open");
 $("#languageSelect").onchange=async e=>{try{state.user=await api("/api/me",{method:"PATCH",body:JSON.stringify({name:state.user.name,email:state.user.email,businessName:state.user.businessName||"Hillsgoods",businessTagline:state.user.businessTagline||"Malamchirakk",language:e.target.value})});render()}catch(err){errToast(err)}};
 $("#signOut")?.addEventListener("click",()=>{sessionStorage.removeItem(TOKEN_KEY);state.user=null;loginView()});
 $("#profileJump").onclick=()=>go("settings");
 $("#globalSearch").oninput=e=>{state.query=e.target.value;if(state.page==="products")render();};
 document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));
}
function loginView(){ $("#root").innerHTML=`<div class="login-wrap"><form class="login" id="loginForm"><h1>Hillsgoods</h1><p>Sign in to manage products, daily rates, purchases, sales and stock.</p><div class="form-field"><label>Email</label><input name="email" type="email" required autocomplete="username"></div><div class="form-field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="primary" type="submit">Sign in</button><div id="loginError" class="error"></div><p class="muted-note">First-time setup must be completed securely through the backend setup endpoint.</p></form></div>`;
 $("#loginForm").onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button[type="submit"]'),error=$("#loginError"),f=Object.fromEntries(new FormData(form));button.disabled=true;button.textContent="Signing in…";error.textContent="";try{const data=await api("/api/login",{method:"POST",body:JSON.stringify(f)});sessionStorage.setItem(TOKEN_KEY,data.token);state.user=data.user;state.products=[];state.transactions=[];state.rates=[];state.summary=null;render();loadAll().then(()=>render()).catch(err=>{if(/401|unauthorized|token/i.test(err.message)){sessionStorage.removeItem(TOKEN_KEY);state.user=null;loginView()}else toast("Signed in, but some dashboard data could not load: "+err.message)})}catch(err){error.textContent=err.message;button.disabled=false;button.textContent="Sign in"}};
}
async function loadAll(){const [user,products,transactions,rates,summary]=await Promise.all([api("/api/me"),api("/api/products"),api("/api/transactions"),api("/api/rates"),api("/api/summary")]);state.user=user;state.products=products;state.transactions=transactions;state.rates=rates;state.summary=summary}
async function refresh(){await loadAll();render()}
function go(p){state.page=p;$("#sidebar")?.classList.remove("open");render()}
function render(){if(!sessionStorage.getItem(TOKEN_KEY)){loginView();return}let html="";
if(state.page==="dashboard")html=dashboard();
if(state.page==="products")html=productsPage();

if(state.page==="transactions")html=transactionsPage();

 const s=state.summary||{}, tx=state.transactions, has=tx.length>0;
 const todays=tx.filter(t=>dateOnly(t.date)===dateOnly(new Date()));

 <div class="two-col"><section class="panel"><div class="panel-head"><h3>Monthly performance</h3><span class="muted small">${new Date().toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</span></div>
 <div class="metrics" style="grid-template-columns:1fr 1fr;margin:0">${metric("↗","Sales",money(monthlySales),thisMonth.filter(t=>t.type==="Sale").length+" sales")}${metric("₹","Gross Profit",money(monthlyProfit),thisMonth.some(t=>t.type==="Sale")?"Based on cost of goods sold":"Not enough data yet")}</div>
 ${!has?`<div class="notice">No transactions recorded yet. Add a purchase first, then record sales to calculate real profit.</div>`:""}
 <p class="muted-note">Monthly figures are based only on records currently saved. Previous months and years will appear when you have data for those periods.</p></section>
 <section class="panel"><div class="panel-head"><h3>Low stock</h3><button class="secondary" data-page="stock">View stock</button></div>
 ${state.products.filter(p=>p.stock<=p.lowStockThreshold).length?state.products.filter(p=>p.stock<=p.lowStockThreshold).map(p=>`<div class="stock-meta"><span>${esc(productName(p))}</span><strong>${num(p.stock)} ${esc(p.unit)}</strong></div>`).join(""):noData("No low-stock alerts","Products will appear here when stock reaches their threshold.")}</section></div>

function productsPage(){return `${pageTitle("Products","Add products, upload their images, and manage units and prices.",`<button class="primary" data-action="product">+ Add product</button>`)}

function productCards(items){if(!items.length)return noData("No products yet","Add your first product and upload its image.");return items.map(p=>`<article class="product-card"><div class="product-img">${imageHTML(p)}</div><div class="product-body"><h3>${esc(productName(p))}</h3><div class="small muted">${esc(p.category)} · ${esc(p.unit)}</div><div class="product-prices"><div>Buying<strong>${money(p.purchaseRate)}</strong></div><div>Selling<strong>${money(p.salesRate)}</strong></div></div><div class="stock-meta"><span>Stock: <b>${num(p.stock)} ${esc(p.unit)}</b></span><span class="stock-tag ${p.stock<=p.lowStockThreshold?"low":""}">${p.stock<=p.lowStockThreshold?"Low stock":"In stock"}</span></div><div class="card-actions" style="margin-top:12px"><button class="secondary" data-edit-product="${p._id}">Edit</button><button class="secondary danger" data-archive="${p._id}">Archive</button></div></div></article>`).join("")}
function ratesPage(){return `${pageTitle("Current Rates","Update market prices daily. Every saved change keeps a dated rate history.",`<button class="primary" data-action="rates">Update rates</button>`)}
 <div class="panel"><div class="panel-head"><h3>Current market and trading rates</h3><span class="muted small">Latest saved values</span></div>
 ${state.products.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Market rate</th><th>Buying price</th><th>Selling price</th><th>Last updated</th><th></th></tr></thead><tbody>${state.products.map(p=>`<tr><td><b>${esc(productName(p))}</b><div class="muted small">${esc(p.unit)}</div></td><td>${money(p.currentMarketRate||0)}</td><td>${money(p.purchaseRate)}</td><td>${money(p.salesRate)}</td><td>${p.rateUpdatedAt?displayDate(p.rateUpdatedAt):"Not updated"}</td><td><button class="secondary" data-edit-rate="${p._id}">Edit rates</button></td></tr>`).join("")}</tbody></table></div>`:noData("No products","Add products first to start recording their market rates.")}</div>

function transactionsPage(){
 const mode=state.reportMode||"month", month=state.reportMonth||new Date().toISOString().slice(0,7), year=state.reportYear||String(new Date().getFullYear());
 const inPeriod=state.transactions.filter(t=>{const d=new Date(t.date);return mode==="month"?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`===month:String(d.getFullYear())===year});
 const tx=inPeriod.filter(t=>(state.txTab==="All"||t.type===state.txTab)&&`${t.productName} ${t.party} ${t.type} ${t.invoiceNo||""}`.toLowerCase().includes(state.query.toLowerCase()));
 const sales=tx.filter(t=>t.type==="Sale"), purchases=tx.filter(t=>t.type==="Purchase"), expenses=tx.filter(t=>t.type==="Expense");
 const gross=sales.reduce((a,t)=>a+(t.grossProfit||0),0), expenseTotal=expenses.reduce((a,t)=>a+t.amount,0), net=gross-expenseTotal;
 const groups=new Map();tx.forEach(t=>{const d=new Date(t.date),key=mode==="year"?d.toLocaleString("en-IN",{month:"long"}):d.toLocaleDateString("en-IN",{day:"2-digit",month:"short"});if(!groups.has(key))groups.set(key,[]);groups.get(key).push(t)});
 const periodLabel=mode==="year"?year:new Date(month+"-01T00:00:00").toLocaleString("en-IN",{month:"long",year:"numeric"});
 return `${pageTitle("Transactions","Review trading performance and print monthly or yearly transaction reports.",`<button class="primary" data-action="transaction">+ New invoice</button>`)}
 <div class="panel" style="margin-bottom:14px"><div class="panel-head"><h3>Transaction report</h3><button class="primary" id="printTxReport">Print / Save PDF</button></div><div class="filters"><select class="field" id="reportMode"><option value="month" ${mode==="month"?"selected":""}>Monthly report</option><option value="year" ${mode==="year"?"selected":""}>Yearly report</option></select>${mode==="month"?`<input class="field" id="reportMonth" type="month" value="${month}">`:`<select class="field" id="reportYear">${[...new Set([new Date().getFullYear(),...state.transactions.map(t=>new Date(t.date).getFullYear())])].sort((a,b)=>b-a).map(y=>`<option ${String(y)===year?"selected":""}>${y}</option>`).join("")}</select>`}</div>
 <div id="printReport"><div class="panel-head"><div><h3>Hillsgoods — ${mode==="year"?"Yearly":"Monthly"} Transaction Statement</h3><div class="muted small">Period: ${periodLabel}</div></div><div class="muted small">${tx.length} transactions</div></div>
 <div class="metrics">${metric("↗","Sales",money(sales.reduce((a,t)=>a+t.amount,0)),sales.length+" records")}${metric("₹","Gross profit",money(gross),"Sales less cost of goods")}${metric("−","Expenses",money(expenseTotal),expenses.length+" records")}${metric("⇄",net>=0?"Net gain":"Net loss",money(Math.abs(net)),"Gross profit less expenses")}</div>
 ${mode==="year"?`<h3>Monthly breakdown</h3>${groups.size?[...groups].map(([label,items])=>{const ss=items.filter(t=>t.type==="Sale"),ee=items.filter(t=>t.type==="Expense"),gp=ss.reduce((a,t)=>a+(t.grossProfit||0),0),ex=ee.reduce((a,t)=>a+t.amount,0);return `<div class="stock-meta"><b>${label}</b><span>${items.length} transactions · Sales ${money(ss.reduce((a,t)=>a+t.amount,0))} · Net ${gp-ex>=0?"+":"−"}${money(Math.abs(gp-ex))}</span></div>`}).join(""):noData("No transactions in this year","There is no data to include in this report.")}`:""}
 <h3 style="margin:18px 0 10px">${mode==="year"?"Transactions by month":"Transactions for the month"}</h3>${tx.length?transactionTable(tx):noData("No transactions for this period","There are no records to print for the selected period.")}</div></div>
 <div class="panel" style="margin-bottom:14px"><div class="panel-head"><h3>Gains & losses trend</h3><span class="muted small">${mode==="year"?"Monthly":"Daily"} net performance</span></div>${profitTrendChart(tx,mode)}</div>
 <div class="panel"><div class="panel-head"><h3>Invoices and transactions</h3><span class="muted small">${tx.length} records</span></div><div class="filters">${["All","Sale","Purchase","Expense"].map(t=>`<button class="${state.txTab===t?"primary":"secondary"}" data-txtab="${t}">${t==="All"?"All transactions":t==="Sale"?"Sales":t==="Purchase"?"Purchases":"Expenses"}</button>`).join("")}</div>${tx.length?transactionTable(tx):noData("No matching transactions","Create your first purchase or sales invoice.")}</div>`;
}
function profitTrendChart(items,mode){const map=new Map();items.forEach(t=>{const d=new Date(t.date),key=mode=== "year"?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`:dateOnly(d);if(!map.has(key))map.set(key,{gain:0,loss:0,label:mode==="year"?d.toLocaleString("en-IN",{month:"short"}):d.toLocaleDateString("en-IN",{day:"2-digit",month:"short"})});const v=map.get(key);if(t.type==="Sale")v.gain+=Number(t.grossProfit)||0;if(t.type==="Expense")v.loss+=Number(t.amount)||0});const rows=[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0]));if(!rows.length)return noData("No trend data yet","Record sales and expenses to see gains and losses.");const values=rows.map(x=>x[1].gain-x[1].loss),max=Math.max(1,...values.map(Math.abs)),w=680,h=230,pad=34,x=i=>pad+i*(w-2*pad)/Math.max(1,rows.length-1),y=v=>h/2-v/max*(h/2-pad);const pts=values.map((v,i)=>`${x(i)},${y(v)}`).join(" ");return `<div style="overflow-x:auto"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Net gains and losses line graph" style="width:100%;min-width:320px;height:auto"><line x1="${pad}" y1="${h/2}" x2="${w-pad}" y2="${h/2}" stroke="#aeb8b0" stroke-dasharray="4 4"/><polyline points="${pts}" fill="none" stroke="#16733a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${v<0?"#b42318":"#16733a"}"/><text x="${x(i)}" y="${h-8}" font-size="10" text-anchor="middle" fill="#59645d">${esc(rows[i][1].label)}</text>`).join("")}</svg></div><div class="muted small">Net result = gross profit from sales − recorded expenses. Purchases are shown in the report but are treated as inventory purchases, not immediate operating expenses.</div>`}

function transactionTable(items){return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Invoice</th><th>Type</th><th>Product / details</th><th>Party</th><th>Quantity</th><th>Rate</th><th>Amount</th><th>Gross profit</th></tr></thead><tbody>${items.map(t=>`<tr><td>${displayDate(t.date)}</td><td>${esc(t.invoiceNo||"—")}</td><td><span class="tag ${esc(t.type)}">${esc(t.type)}</span></td><td>${esc(t.productName)}</td><td>${esc(t.party||"—")}</td><td>${num(t.quantity)} ${esc(t.unit||"")}</td><td>${money(t.rate)}</td><td><b>${money(t.amount)}</b></td><td>${t.type==="Sale"?money(t.grossProfit||0):"—"}</td></tr>`).join("")}</tbody></table></div>`}
function stockPage(){return `${pageTitle("Stock","Live stock quantities and value at recorded average purchase cost.",`<button class="primary" data-action="transaction">+ Stock movement</button>`)}
 <div class="metrics">${metric("⬡","Products",state.products.length)}${metric("▣","Units in stock",num(state.products.reduce((a,p)=>a+p.stock,0)))}${metric("₹","Stock value",money(state.summary?.stockValueAtCost||0),"Average cost basis")}${metric("!","Low stock",state.products.filter(p=>p.stock<=p.lowStockThreshold).length,"At or below threshold")}</div>
 <div class="stock-grid">${state.products.length?state.products.map(p=>`<article class="stock-card"><div class="stock-card-head"><div class="stock-thumb">${imageHTML(p)}</div><div><h3>${esc(productName(p))}</h3><span class="stock-tag ${p.stock<=p.lowStockThreshold?"low":""}">${p.stock<=p.lowStockThreshold?"Low stock":"In stock"}</span></div></div><div class="stock-qty">${num(p.stock)} <span class="small muted">${esc(p.unit)}</span></div><div class="muted small">Current stock quantity</div><div class="stock-meta"><span>Avg. cost / ${esc(p.unit)}</span><b>${money(p.averageCost||p.purchaseRate)}</b></div><div class="stock-meta"><span>Stock value</span><b>${money(p.stock*(p.averageCost||p.purchaseRate))}</b></div></article>`).join(""):noData("No stock yet","Add a product or record a purchase to build your stock.")}</div>`}

 <div class="two-col"><section class="panel"><div class="panel-head"><h3>Your profile</h3></div><form id="profileForm" class="form-grid"><div class="form-field full"><label>Display name</label><input name="name" required value="${esc(state.user?.name||"")}"></div><div class="form-field full"><label>Email address</label><input name="email" type="email" required value="${esc(state.user?.email||"")}"></div><div class="form-field full"><label>Business name</label><input name="businessName" value="${esc(state.user?.businessName||"Hillsgoods")}"></div><div class="form-field full"><label>Business tagline / location</label><input name="businessTagline" value="${esc(state.user?.businessTagline||"Malamchirakk")}"></div><div class="form-field full"><label>Preferred language / ഇഷ്ടഭാഷ</label><select name="language"><option value="en" ${state.user?.language!=="ml"?"selected":""}>English</option><option value="ml" ${state.user?.language==="ml"?"selected":""}>മലയാളം</option></select></div><div class="form-field full"><button class="primary">Save profile</button></div></form><div style="border-top:1px solid var(--line);margin-top:18px;padding-top:16px;display:flex;justify-content:flex-end"><button type="button" class="secondary danger" id="signOut">Sign out</button></div></section>

function wirePage(){
 $("#productSearch")?.addEventListener("input",e=>{state.query=e.target.value;$("#productCards").innerHTML=productCards(productFiltered())});
 $("#productCategory")?.addEventListener("change",e=>{const cat=e.target.value;$("#productCards").innerHTML=productCards(productFiltered().filter(p=>!cat||p.category===cat))});
 document.querySelectorAll("[data-txtab]").forEach(b=>b.onclick=()=>{state.txTab=b.dataset.txtab;render()});
 $("#reportMode")?.addEventListener("change",e=>{state.reportMode=e.target.value;render()});
 $("#reportMonth")?.addEventListener("change",e=>{state.reportMonth=e.target.value;render()});
 $("#reportYear")?.addEventListener("change",e=>{state.reportYear=e.target.value;render()});
 $("#printTxReport")?.addEventListener("click",()=>window.print());
 document.querySelectorAll("[data-edit-product]").forEach(b=>b.onclick=()=>productModal(state.products.find(p=>p._id===b.dataset.editProduct)));
 document.querySelectorAll("[data-archive]").forEach(b=>b.onclick=async()=>{if(confirm("Archive this product? It will be hidden from the active catalogue.")){try{await api("/api/products/"+b.dataset.archive,{method:"DELETE"});await refresh();toast("Product archived")}catch(e){errToast(e)}}});
 document.querySelectorAll("[data-edit-rate]").forEach(b=>b.onclick=()=>rateModal(state.products.find(p=>p._id===b.dataset.editRate)));
 document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{if(b.dataset.action==="product")productModal();if(b.dataset.action==="transaction")transactionModal();if(b.dataset.action==="rates")rateModal()});
 $("#profileForm")?.addEventListener("submit",async e=>{e.preventDefault();try{state.user=await api("/api/me",{method:"PATCH",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await refresh();toast("Profile updated")}catch(err){errToast(err)}});
 $("#passwordForm")?.addEventListener("submit",async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(d.newPassword!==d.confirmPassword)return toast("New passwords do not match.");try{await api("/api/me/password",{method:"PATCH",body:JSON.stringify({currentPassword:d.currentPassword,newPassword:d.newPassword})});e.target.reset();toast("Password changed")}catch(err){errToast(err)}});
 $("#userCreateForm")?.addEventListener("submit",async e=>{e.preventDefault();try{await api("/api/users",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();toast("User created");await loadUsers()}catch(err){errToast(err)}});
 if($("#userList"))loadUsers();

async function loadUsers(){try{const users=await api("/api/users");$("#userList").innerHTML=`<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Language</th><th>Created</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.language==="ml"?"മലയാളം":"English"}</td><td>${displayDate(u.createdAt)}</td></tr>`).join("")}</tbody></table></div>`}catch(e){$("#userList").textContent=e.message}}

function modal(title,body,onSubmit){$("#modalRoot").innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2><button class="close" id="closeModal">×</button></div>${body}</div></div>`;const close=()=>$("#modalRoot").innerHTML="";$("#closeModal").onclick=close;$("#modalBackdrop").onclick=e=>{if(e.target.id==="modalBackdrop")close()};const form=$("#modalForm");form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector("button[type=submit]");btn.disabled=true;try{await onSubmit(new FormData(form));close()}catch(err){errToast(err);btn.disabled=false}}}
function productModal(p=null){const body=`<form id="modalForm"><div class="form-grid"><div class="form-field"><label>Product name (English)</label><input name="nameEn" maxlength="120" value="${esc(p?.nameEn||p?.name||"")}" placeholder="e.g. Cardamom"></div><div class="form-field"><label>ഉൽപ്പന്നത്തിന്റെ പേര് (മലയാളം)</label><input name="nameMl" maxlength="120" value="${esc(p?.nameMl||"")}" placeholder="ഉദാ. ഏലക്ക"></div><div class="form-field"><label>Category</label><input name="category" required value="${esc(p?.category||"Agricultural products")}"></div><div class="form-field"><label>Unit</label><select name="unit">${["kg","liter","pcs"].map(u=>`<option ${p?.unit===u?"selected":""}>${u}</option>`).join("")}</select></div><div class="form-field"><label>Opening stock / current stock</label><input name="stock" type="number" min="0" step=".001" required value="${p?.stock??0}" ${p?"readonly":""}></div><div class="form-field"><label>Buying price (₹ per unit)</label><input name="purchaseRate" type="number" min="0" step=".01" required value="${p?.purchaseRate??0}"></div><div class="form-field"><label>Selling price (₹ per unit)</label><input name="salesRate" type="number" min="0" step=".01" required value="${p?.salesRate??0}"></div><div class="form-field"><label>Current market rate (₹)</label><input name="currentMarketRate" type="number" min="0" step=".01" value="${p?.currentMarketRate??0}"></div><div class="form-field"><label>Low-stock threshold</label><input name="lowStockThreshold" type="number" min="0" step=".001" value="${p?.lowStockThreshold??10}"></div><div class="form-field full"><label>Product image</label><input name="imageFile" type="file" accept="image/*"><div class="muted-note">Upload JPG, PNG or WebP up to 1 MB. The image is saved with this product.</div><input type="hidden" name="imageUrl" value="${esc(p?.imageUrl||"")}"></div></div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary" type="submit">${p?"Save changes":"Add product"}</button></div></form>`;
 modal(p?"Edit product":"Add product",body,async fd=>{const file=fd.get("imageFile");let imageUrl=fd.get("imageUrl");if(file&&file.size){if(file.size>1024*1024)throw new Error("Image must be 1 MB or smaller.");imageUrl=await fileToDataURL(file)}const data={name:fd.get("nameEn")||fd.get("nameMl"),nameEn:fd.get("nameEn"),nameMl:fd.get("nameMl"),category:fd.get("category"),unit:fd.get("unit"),purchaseRate:+fd.get("purchaseRate"),salesRate:+fd.get("salesRate"),currentMarketRate:+fd.get("currentMarketRate"),lowStockThreshold:+fd.get("lowStockThreshold"),imageUrl};if(!p)data.stock=+fd.get("stock");await api(p?"/api/products/"+p._id:"/api/products",{method:p?"PATCH":"POST",body:JSON.stringify(data)});await refresh();toast(p?"Product updated":"Product added")});
 $("#cancelModal").onclick=()=>$("#modalRoot").innerHTML="";
}
function rateModal(p=null){const list=p?[p]:state.products;if(!list.length){toast("Add a product first.");return}const body=`<form id="modalForm"><div class="form-field"><label>Product</label><select name="productId" id="rateProduct">${list.map(x=>`<option value="${x._id}">${esc(productName(x))}</option>`).join("")}</select></div><div class="form-grid" style="margin-top:13px"><div class="form-field"><label>Today's market rate (₹ per unit)</label><input name="marketRate" type="number" min="0" step=".01" required value="${p?.currentMarketRate??0}"></div><div class="form-field"><label>New buying price (₹ per unit)</label><input name="purchaseRate" type="number" min="0" step=".01" required value="${p?.purchaseRate??0}"></div><div class="form-field"><label>New selling price (₹ per unit)</label><input name="salesRate" type="number" min="0" step=".01" required value="${p?.salesRate??0}"></div><div class="form-field"><label>Effective date</label><input name="date" type="date" required value="${dateOnly(new Date())}"></div><div class="form-field full"><label>Note (optional)</label><input name="note" maxlength="250" placeholder="Market change, supplier quote…"></div></div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary" type="submit">Save rates</button></div></form>`;
 modal(p?"Update product rates":"Update current rates",body,async fd=>{await api("/api/rates",{method:"POST",body:JSON.stringify({productId:fd.get("productId"),marketRate:+fd.get("marketRate"),purchaseRate:+fd.get("purchaseRate"),salesRate:+fd.get("salesRate"),date:fd.get("date"),note:fd.get("note")})});await refresh();toast("Rates saved with date history")});
 $("#cancelModal").onclick=()=>$("#modalRoot").innerHTML="";
}
function transactionModal(){if(!state.products.length){toast("Add a product before creating a purchase or sale.");return}const body=`<form id="modalForm"><div class="form-grid"><div class="form-field"><label>Invoice type</label><select name="type" id="txType"><option value="Purchase">Purchase invoice</option><option value="Sale">Sales invoice</option><option value="Expense">Expense</option></select></div><div class="form-field"><label>Date</label><input name="date" type="date" required value="${dateOnly(new Date())}"></div><div class="form-field full"><label>Product</label><select name="productId" id="txProduct">${state.products.map(p=>`<option value="${p._id}">${esc(productName(p))} — stock ${num(p.stock)} ${esc(p.unit)}</option>`).join("")}<option value="">— Expense only —</option></select></div><div class="form-field"><label>Customer / supplier</label><input name="party" maxlength="160" placeholder="Name / company"></div><div class="form-field"><label>Quantity</label><input name="quantity" id="txQty" type="number" min=".001" step=".001" required value="1"></div><div class="form-field"><label>Unit</label><input id="txUnit" name="unit" readonly value="${esc(state.products[0].unit)}"></div><div class="form-field"><label>Rate per unit (₹)</label><input name="rate" id="txRate" type="number" min="0" step=".01" required value="${state.products[0].purchaseRate}"></div><div class="form-field"><label>Total amount (₹)</label><input name="amount" id="txAmount" type="number" min="0" step=".01" required value="${state.products[0].purchaseRate}"></div><div class="form-field full"><label>Notes</label><textarea name="notes" maxlength="1000"></textarea></div></div><div id="txHint" class="muted-note"></div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary" type="submit">Save invoice</button></div></form>`;
 modal("Create transaction invoice",body,async fd=>{const type=fd.get("type"),productId=fd.get("productId"),product=state.products.find(p=>p._id===productId);if(type!=="Expense"&&!product)throw new Error("Choose a product.");const data={type,date:fd.get("date"),productId:type==="Expense"?null:productId,productName:type==="Expense"?"Expense":product.name,party:fd.get("party"),quantity:type==="Expense"?0:+fd.get("quantity"),unit:type==="Expense"?"none":product.unit,rate:+fd.get("rate"),amount:+fd.get("amount"),notes:fd.get("notes")};await api("/api/transactions",{method:"POST",body:JSON.stringify(data)});await refresh();toast("Invoice saved and stock updated")});
 $("#cancelModal").onclick=()=>$("#modalRoot").innerHTML="";
 const sync=()=>{const type=$("#txType").value,id=$("#txProduct").value,p=state.products.find(x=>x._id===id);$("#txProduct").disabled=type==="Expense";$("#txQty").required=type!=="Expense";if(p){$("#txUnit").value=p.unit;if(!$("#txRate").dataset.touched)$("#txRate").value=type==="Sale"?p.salesRate:p.purchaseRate}else{$("#txUnit").value="none";$("#txRate").value=0}$("#txAmount").value=(+$("#txQty").value||0)*(+$("#txRate").value||0);$("#txHint").textContent=type==="Sale"&&p?`Available stock: ${num(p.stock)} ${p.unit}. Estimated gross profit uses average purchase cost.`:"Amount is quantity × rate. Expense records do not change product stock."};
 $("#txType").onchange=sync;$("#txProduct").onchange=()=>{delete $("#txRate").dataset.touched;sync()};$("#txQty").oninput=sync;$("#txRate").oninput=()=>{$("#txRate").dataset.touched="1";sync()};sync();
}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error("Could not read image."));r.readAsDataURL(file)})}
(async()=>{try{if(sessionStorage.getItem(TOKEN_KEY)){await loadAll();render()}else loginView()}catch(e){sessionStorage.removeItem(TOKEN_KEY);loginView();toast(e.message)}})();
</script>
</body></html>

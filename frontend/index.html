<style>

main{margin-left:234px;min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:10}.search-global{width:min(460px,55%);background:#f2f3f1;border-radius:30px;padding:11px 15px;display:flex;gap:10px;align-items:center}.search-global input{border:0;outline:0;background:transparent;width:100%;font-size:13px}.top-actions{display:flex;align-items:center;gap:18px}.icon-btn{border:0;background:transparent;font-size:19px;position:relative}.dot{position:absolute;width:7px;height:7px;background:#dc4036;border-radius:50%;right:0;top:1px}.profile{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{width:36px;height:36px;background:var(--green);color:white;border-radius:50%;display:grid;place-items:center;font-weight:700}.mobile-menu{display:none}
.content{padding:0 25px 30px;max-width:1800px;margin:auto}.hero{height:294px;margin:0 -25px 16px;position:relative;overflow:hidden;background:linear-gradient(90deg,rgba(5,36,24,.83),rgba(5,36,24,.16)),url('https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1800&q=85') center 48%/cover;display:flex;align-items:center;padding:40px 44px;color:white}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.1),transparent 50%);pointer-events:none}.hero-copy{position:relative;z-index:1;max-width:600px}.eyebrow{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#c4ed4c;margin-bottom:14px}.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,4vw,58px);line-height:1.02;letter-spacing:-1.5px;margin:0 0 15px;font-weight:700}.hero h1 span{color:#b3df49}.hero p{font-size:16px;line-height:1.55;margin:0;max-width:480px;color:#f3f6f1}

.lower-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.95fr);gap:15px}.panel{background:#fff;border:1px solid #edf0ec;border-radius:12px;padding:15px;min-width:0;box-shadow:0 2px 10px #173b2605}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}.panel-head h3{font-size:15px;margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th{background:#f4f5f3;color:#515b55;text-align:left;font-weight:550;padding:10px 9px}td{padding:10px 9px;border-bottom:1px solid #edf0ec}tr:last-child td{border-bottom:0}.tag{display:inline-block;border-radius:20px;padding:4px 9px;font-size:11px}.purchase{background:#eaf4df;color:#29572e}.sale{background:#eaf1f8;color:#27527c}.stock-list{display:grid;gap:13px}.stock-row{display:grid;grid-template-columns:36px minmax(55px,.55fr) minmax(60px,1fr) 62px;align-items:center;gap:9px;font-size:11px}.stock-row img{width:36px;height:36px;object-fit:cover;border-radius:8px}.stock-name{font-weight:650}.bar{height:7px;background:#e9ebe8;border-radius:9px;overflow:hidden}.bar span{height:100%;display:block;background:var(--green);border-radius:9px}.stock-qty{text-align:right;font-weight:650}.stock-qty small{display:block;font-weight:400;color:var(--muted);margin-top:4px}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:23px 0 18px}.page-title h1{margin:0;font-size:30px;letter-spacing:-.8px}.page-title p{margin:5px 0 0;color:var(--muted);font-size:14px}.primary{background:var(--green);color:#fff;border:0;border-radius:9px;padding:12px 17px;font-size:13px;font-weight:650;box-shadow:0 4px 9px #103b2914}.primary:hover{background:#20553a}.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:10px;margin:20px 0 15px}.field{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;background:#fff;padding:11px 12px;font-size:13px;color:#3d4941;outline-color:#9ac75e}.products-table{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.products-table table{font-size:12px}.products-table th,.products-table td{padding:11px 12px}.stock-green{color:#17622b;font-weight:700}.status{border-radius:20px;padding:5px 11px;background:#edf5e5;color:#24582e;display:inline-block}.status.low{background:#fff4d8;color:#986500}.action-small{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 8px}.pagination{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;padding:15px 4px}.page-buttons{display:flex;gap:7px}.page-buttons button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 12px}.page-buttons button.current{background:var(--green);color:white}
.ledger-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(270px,.85fr);gap:15px}.ledger-metrics{margin-top:0}.chart{height:175px;display:flex;align-items:end;justify-content:space-around;gap:12px;padding:20px 8px 24px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,#eef0ed 40px)}.bar-group{height:100%;display:flex;align-items:end;gap:4px;position:relative;flex:1;max-width:42px}.chart-bar{width:50%;border-radius:4px 4px 0 0;background:var(--green)}.chart-bar.alt{background:#a7d38a}.bar-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}.statement{width:100%;font-size:12px}.statement td{padding:9px 8px}.statement .highlight{background:#edf5e5;font-weight:700;color:#173c25}.statement .net{background:#d9ebcb;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:0;background:#f1f3f0;padding:9px 14px;border-radius:20px;font-size:12px}.tabs button.active{background:var(--green);color:white}.ledger-tools{display:flex;gap:9px;margin:12px 0}.ledger-tools input{flex:1;min-width:0}.hidden{display:none!important}
.modal-backdrop{position:fixed;inset:0;background:#081d13a8;display:grid;place-items:center;padding:18px;z-index:50}.modal{background:white;border-radius:16px;padding:23px;width:min(500px,100%);box-shadow:0 20px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:21px}.close{border:0;background:#f1f3ef;border-radius:50%;width:34px;height:34px;font-size:19px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-field label{display:block;font-size:12px;color:#5d685f;margin-bottom:6px}.form-field input,.form-field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff}.form-field.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.secondary{background:white;border:1px solid var(--line);padding:11px 16px;border-radius:8px}.toast{position:fixed;bottom:22px;right:22px;background:#103b29;color:#fff;padding:13px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:60;font-size:13px}

@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:transform .25s;width:250px;box-shadow:15px 0 35px #0002}.sidebar.open{transform:translateX(0)}main{margin-left:0}.topbar{height:60px;padding:0 14px;gap:10px}.mobile-menu{display:block;border:0;background:transparent;font-size:22px}.search-global{width:auto;flex:1;padding:10px 12px}.search-global input{font-size:12px}.top-actions{gap:10px}.profile .user-name{display:none}.avatar{width:32px;height:32px}.content{padding:0 14px 24px}.hero{margin:0 -14px 14px;height:255px;padding:28px 22px;background-position:center}.hero h1{font-size:39px}.hero p{font-size:14px}.eyebrow{font-size:10px;letter-spacing:2.5px}.metrics{gap:9px;margin-bottom:17px}.metric{padding:12px 10px;gap:9px;border-radius:10px}.metric-icon{width:37px;height:37px;flex-basis:37px;font-size:17px}.metric-label{font-size:10px;margin-bottom:5px}.metric-value{font-size:17px}.metric-sub{font-size:10px;margin-top:5px}.section-head h2{font-size:19px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product-card{height:155px}.product-card:last-child{display:none}.product-info{padding:11px}.product-info strong{font-size:13px}.lower-grid{gap:12px}.panel{padding:12px}.panel-head h3{font-size:14px}.topbar .search-global{max-width:calc(100% - 130px)}.page-title{padding:20px 0 15px;align-items:flex-start}.page-title h1{font-size:26px}.page-title p{font-size:12px;line-height:1.4}.primary{padding:11px 12px;white-space:nowrap;font-size:12px}.filters{grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.filters .search-field{grid-column:1/-1}.filters .clear-filter{grid-column:1/-1}.products-table{overflow:visible;border:0;background:transparent}.products-table table,.products-table tbody{display:block;width:100%}.products-table thead{display:none}.products-table tr{display:grid;grid-template-columns:1fr auto;gap:5px 12px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px;white-space:normal}.products-table td{border:0;padding:0}.products-table td:nth-child(1),.products-table td:nth-child(2),.products-table td:nth-child(4){display:none}.products-table td:nth-child(3){font-weight:700;font-size:14px}.products-table td:nth-child(5){grid-column:1;font-size:12px;color:var(--muted)}.products-table td:nth-child(6),.products-table td:nth-child(7){font-size:12px}.products-table td:nth-child(8){grid-column:2;grid-row:1/4;align-self:center}.products-table td:nth-child(9){grid-column:2;grid-row:4}.pagination{gap:8px;flex-wrap:wrap}.ledger-layout{grid-template-columns:1fr}.chart{height:150px}.ledger-tools{flex-wrap:wrap}.ledger-tools input{flex-basis:100%}.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}.sidebar-foot{display:none}}
@media(max-width:390px){.hero{height:225px}.hero h1{font-size:33px}.metric{display:block}.metric-icon{margin-bottom:8px}.metric-value{font-size:16px}.products{gap:8px}.product-card{height:140px}.product-info{padding:9px}.product-info small{font-size:10px}.top-actions .icon-btn{display:none}.page-title h1{font-size:23px}.primary{font-size:11px;padding:10px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="leaf">◢</span><div class="brand-mark">Hillsgoods</div><small>MALAMCHIRAKK</small></div>
  <nav class="nav" id="nav">
    <button class="active" data-page="home"><span class="ico">⌂</span>Dashboard</button>
    <button data-page="products"><span class="ico">⬡</span>Products</button>
    <button data-page="purchases"><span class="ico">🛒</span>Purchase</button>
    <button data-page="sales"><span class="ico">▤</span>Sales</button>
    <button data-page="stock"><span class="ico">▣</span>Stock</button>
    <button data-page="suppliers"><span class="ico">♧</span>Suppliers</button>
    <button data-page="customers"><span class="ico">♙</span>Customers</button>
    <button data-page="ledger"><span class="ico">₹</span>Ledger & P/L</button>
    <button data-page="reports"><span class="ico">▥</span>Reports</button>
    <button data-page="settings"><span class="ico">⚙</span>Settings</button>
  </nav>
  <div class="sidebar-foot">Natural Trade<br>from Malamchirakk</div>
</aside>
<main>
<header class="topbar">
  <button class="mobile-menu" id="menuBtn" aria-label="Open menu">☰</button>
  <div class="search-global">⌕ <input id="globalSearch" placeholder="Search products, suppliers, invoices..." aria-label="Search"></div>
  <div class="top-actions"><button class="icon-btn" aria-label="Notifications">♧<span class="dot"></span></button><div class="profile"><div class="avatar">F</div><span class="user-name">Faheem</span><span>⌄</span></div></div>
</header>
<div class="content" id="pageContent"></div>
</main>
</div>
<div id="modalRoot"></div>
<script>
const imgs={
 hills:"https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1800&q=85",
 arecanut:"https://images.unsplash.com/photo-1604495772376-9657f0035eb5?auto=format&fit=crop&w=500&q=80",
 pepper:"https://images.unsplash.com/photo-1599909533609-4f2d6f4f5d5c?auto=format&fit=crop&w=500&q=80",
 cashew:"https://images.unsplash.com/photo-1563412885-139e4045ebc5?auto=format&fit=crop&w=500&q=80",
 coconut:"https://images.unsplash.com/photo-1550828484-5f7a9c1d6c4a?auto=format&fit=crop&w=500&q=80",
 star:"https://images.unsplash.com/photo-1604495772376-9657f0035eb5?auto=format&fit=crop&w=500&q=80"
};
let products=[
{name:"Arecanut (Raw)",category:"Arecanut",unit:"kg",stock:1250,buy:125,sell:150,img:imgs.arecanut,min:150},
{name:"Arecanut (Processed)",category:"Arecanut",unit:"kg",stock:320,buy:180,sell:220,img:imgs.arecanut,min:100},
{name:"Pepper (Black)",category:"Pepper",unit:"kg",stock:480,buy:420,sell:480,img:imgs.pepper,min:100},
{name:"Pepper (White)",category:"Pepper",unit:"kg",stock:120,buy:520,sell:600,img:imgs.pepper,min:150},
{name:"Cashew (W320)",category:"Cashew",unit:"kg",stock:620,buy:650,sell:720,img:imgs.cashew,min:100},
{name:"Cashew (W240)",category:"Cashew",unit:"kg",stock:280,buy:720,sell:800,img:imgs.cashew,min:100},
{name:"Coconut (Whole)",category:"Coconut",unit:"pcs",stock:1850,buy:32,sell:40,img:imgs.coconut,min:300},
{name:"Coconut Fibre",category:"Coconut",unit:"kg",stock:450,buy:18,sell:25,img:imgs.coconut,min:100},
{name:"Coconut Oil",category:"Coconut",unit:"liter",stock:120,buy:160,sell:200,img:imgs.coconut,min:30},
{name:"Star Anise",category:"Spices",unit:"kg",stock:300,buy:850,sell:950,img:imgs.star,min:50}
];
let transactions=[
{date:"30 Oct 2026",type:"Purchase",product:"Arecanut (Raw)",party:"Local Supplier",qty:500,unit:"kg",rate:210,amount:105000},
{date:"28 Oct 2026",type:"Sale",product:"Pepper (Black)",party:"ABC Exports",qty:200,unit:"kg",rate:820,amount:164000},
{date:"27 Oct 2026",type:"Purchase",product:"Coconut (Whole)",party:"Farm Purchase",qty:1000,unit:"pcs",rate:72,amount:72000},
{date:"25 Oct 2026",type:"Sale",product:"Cashew (W320)",party:"Spice Traders",qty:150,unit:"kg",rate:950,amount:142500},
{date:"24 Oct 2026",type:"Purchase",product:"Star Anise",party:"Local Market",qty:50,unit:"kg",rate:760,amount:38000}
];
let activePage="home";
const money=n=>"₹ "+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});
const qty=n=>Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});
function pageShell(title,subtitle,button=""){return `<div class="page-title"><div><h1>${title}</h1><p>${subtitle}</p></div>${button}</div>`}
function metric(icon,label,value,sub=""){return `<div class="metric"><div class="metric-icon">${icon}</div><div><div class="metric-label">${label}</div><div class="metric-value">${value}</div>${sub?`<div class="metric-sub">${sub}</div>`:""}</div></div>`}
function productCards(){return products.slice(0,5).map(p=>`<div class="product-card"><img src="${p.img}" alt="${p.category}" onerror="this.style.display='none'"><div class="product-info"><div><strong>${p.category}</strong><small>Stock: ${qty(p.stock)} ${p.unit}</small></div><span class="arrow">→</span></div></div>`).join("")}
function homePage(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">HILLSGOODS · MALAMCHIRAKK</div><h1>Natural Trade<br>from <span>Our Hills</span></h1><p>Managing our agricultural products and trade, all in one place.</p></div></section>
<div class="metrics">${metric("⬡","Total Products",products.length,"Across all categories")}${metric("🛒","Total Purchases",money(1248500),"This month")}${metric("▤","Total Sales",money(1572300),"This month")}${metric("▰","Current Stock Value",money(products.reduce((s,p)=>s+p.stock*p.buy,0)),"Estimated at purchase cost")}</div>
<div class="section-head"><h2>Our Products</h2><button class="text-link" data-go="products">View All →</button></div><div class="products">${productCards()}</div>
<div class="lower-grid"><section class="panel"><div class="panel-head"><h3>Recent Transactions</h3><button class="text-link" data-go="ledger">View All →</button></div>${transactionTable(transactions.slice(0,5),false)}</section>
<section class="panel"><div class="panel-head"><h3>Stock Overview</h3><button class="text-link" data-go="stock">View All →</button></div><div class="stock-list">${products.slice(0,5).map(p=>`<div class="stock-row"><img src="${p.img}" alt="" onerror="this.style.display='none'"><div class="stock-name">${p.category}</div><div class="bar"><span style="width:${Math.min(100,p.stock/Math.max(p.min*5,1)*100)}%"></span></div><div class="stock-qty">${qty(p.stock)} ${p.unit}<small>${Math.round(Math.min(100,p.stock/Math.max(p.min*5,1)*100))}%</small></div></div>`).join("")}</div></section></div>`}
function transactionTable(rows,showProfit=true){if(!rows.length)return `<p style="padding:20px;color:var(--muted)">No transactions yet. Add a purchase or sale to get started.</p>`;return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Product</th><th>Party</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${t.date}</td><td><span class="tag ${t.type==="Sale"?"sale":"purchase"}">${t.type}</span></td><td>${t.product}</td><td>${t.party||"—"}</td><td>${qty(t.qty)} ${t.unit}</td><td>${money(t.amount)}</td></tr>`).join("")}</tbody></table></div>`}
function productsPage(){return `${pageShell("Products","Manage your products and stock",`<button class="primary" data-action="add-product">＋ Add Product</button>`)}
<div class="metrics">${metric("◉","Arecanut",qty(products.filter(p=>p.category==="Arecanut").reduce((a,p)=>a+p.stock,0))+" kg","Total stock")}${metric("●","Pepper",qty(products.filter(p=>p.category==="Pepper").reduce((a,p)=>a+p.stock,0))+" kg","Total stock")}${metric("◉","Cashew",qty(products.filter(p=>p.category==="Cashew").reduce((a,p)=>a+p.stock,0))+" kg","Total stock")}${metric("◉","Coconut",qty(products.filter(p=>p.category==="Coconut").reduce((a,p)=>a+p.stock,0)),"Mixed units")}</div>
<div class="filters"><input class="field search-field" id="productSearch" placeholder="⌕  Search products..."><select class="field" id="categoryFilter"><option value="">All Categories</option>${[...new Set(products.map(p=>p.category))].map(c=>`<option>${c}</option>`).join("")}</select><select class="field" id="unitFilter"><option value="">All Units</option><option>kg</option><option>liter</option><option>pcs</option></select><select class="field" id="statusFilter"><option value="">All Status</option><option value="In Stock">In Stock</option><option value="Low Stock">Low Stock</option></select><button class="field clear-filter" id="clearFilters">Clear</button></div>
<div class="products-table" id="productsTable"></div><div class="pagination"><span id="productCount"></span><div class="page-buttons"><button disabled>‹</button><button class="current">1</button><button disabled>›</button></div></div>`}
function renderProductsTable(){const root=document.getElementById("productsTable");if(!root)return;const search=(document.getElementById("productSearch")?.value||"").toLowerCase(),cat=document.getElementById("categoryFilter")?.value||"",unit=document.getElementById("unitFilter")?.value||"",status=document.getElementById("statusFilter")?.value||"";const list=products.filter(p=>p.name.toLowerCase().includes(search)&&(!cat||p.category===cat)&&(!unit||p.unit===unit)&&(!status||(p.stock<=p.min?"Low Stock":"In Stock")===status));root.innerHTML=`<table><thead><tr><th>#</th><th>Product</th><th>Category</th><th>Unit</th><th>Current Stock</th><th>Purchase Rate</th><th>Sales Rate</th><th>Status</th><th>Actions</th></tr></thead><tbody>${list.map((p,i)=>`<tr><td>${i+1}</td><td><div style="display:flex;align-items:center;gap:9px"><img src="${p.img}" alt="" style="width:42px;height:42px;object-fit:cover;border-radius:8px" onerror="this.style.display='none'"><strong>${p.name}</strong></div></td><td>${p.category}</td><td>${p.unit}</td><td class="stock-green">${qty(p.stock)}</td><td>${money(p.buy)}</td><td>${money(p.sell)}</td><td><span class="status ${p.stock<=p.min?"low":""}">${p.stock<=p.min?"Low Stock":"In Stock"}</span></td><td><button class="action-small" data-edit-product="${products.indexOf(p)}" title="Edit">✎</button></td></tr>`).join("")}</tbody></table>`;document.getElementById("productCount").textContent=`Showing ${list.length} of ${products.length} products`}
function ledgerPage(){const sales=transactions.filter(t=>t.type==="Sale").reduce((s,t)=>s+t.amount,0),purchases=transactions.filter(t=>t.type==="Purchase").reduce((s,t)=>s+t.amount,0);const gross=sales-purchases;return `${pageShell("Ledger & Profit Loss","Track your purchases, sales and business performance",`<button class="primary" data-action="add-transaction">＋ Add Transaction ▾</button>`)}
<div class="metrics ledger-metrics">${metric("🛒","Total Purchases",money(purchases),"Recorded transactions")}${metric("▤","Total Sales",money(sales),"Recorded transactions")}${metric("▰","Sales − Purchases",money(gross),"Simple cash comparison")}${metric("%","Profit Margin",sales?((gross/sales)*100).toFixed(1)+"%":"0%","Not final accounting profit")}</div>
<div class="ledger-layout"><div><section class="panel" style="margin-bottom:14px"><div class="panel-head"><h3>Sales vs Purchase Trend</h3><span style="font-size:11px;color:var(--muted)">● Sales &nbsp; <span style="color:#a7d38a">●</span> Purchases</span></div><div class="chart">${[40,62,48,75,54,83,65,92,70,58,78,66].map((h,i)=>`<div class="bar-group"><div class="chart-bar" style="height:${h}%"></div><div class="chart-bar alt" style="height:${Math.max(15,h-22)}%"></div><span class="bar-label">${["1","3","5","8","10","13","15","18","21","24","27","30"][i]} Oct</span></div>`).join("")}</div></section>
<section class="panel"><div class="panel-head"><h3>Transactions</h3><button class="text-link" data-action="add-transaction">＋ Add</button></div><div class="tabs" id="ledgerTabs"><button class="active" data-tab="All">All</button><button data-tab="Purchase">Purchases</button><button data-tab="Sale">Sales</button></div><div class="ledger-tools"><input class="field" id="ledgerSearch" placeholder="⌕ Search transactions..."></div><div id="ledgerTable">${transactionTable(transactions)}</div></section></div>
<div><section class="panel" style="margin-bottom:14px"><div class="panel-head"><h3>Profit & Loss Summary</h3></div><table class="statement"><tbody><tr><td>Total Sales</td><td style="text-align:right">${money(sales)}</td></tr><tr><td>Total Purchases</td><td style="text-align:right">${money(purchases)}</td></tr><tr class="highlight"><td>Sales − Purchases</td><td style="text-align:right">${money(gross)}</td></tr><tr><td>Other Expenses</td><td style="text-align:right">${money(0)}</td></tr><tr class="net"><td>Net result*</td><td style="text-align:right">${money(gross)}</td></tr></tbody></table><p style="font-size:11px;color:var(--muted);line-height:1.5">*This is a basic comparison of recorded sales and purchases, not a complete profit calculation. For accurate profit, track the cost of stock sold and expenses.</p></section>
<section class="panel"><div class="panel-head"><h3>Stock at Purchase Rate</h3><button class="text-link" data-go="stock">View All →</button></div><div class="stock-list">${products.slice(0,6).map(p=>`<div class="stock-row"><img src="${p.img}" alt=""><div class="stock-name">${p.category}</div><div class="bar"><span style="width:${Math.min(100,p.stock/Math.max(p.min*5,1)*100)}%"></span></div><div class="stock-qty">${money(p.stock*p.buy)}</div></div>`).join("")}</div></section></div></div>`}
function simplePage(page){let title={purchases:"Purchases",sales:"Sales",stock:"Stock Overview",suppliers:"Suppliers",customers:"Customers",reports:"Reports",settings:"Settings"}[page]||"Dashboard";let subtitle={purchases:"Record and review stock purchases",sales:"Record customer sales",stock:"Current stock across your products",suppliers:"Manage your supplier list",customers:"Manage your customers",reports:"Review business activity",settings:"Configure your Hillsgoods workspace"}[page]||"";return `${pageShell(title,subtitle,`<button class="primary" data-action="${page==="purchases"?"add-transaction":page==="sales"?"add-transaction":"add-product"}">＋ ${page==="purchases"?"Add Purchase":page==="sales"?"Add Sale":page==="stock"?"Stock Adjustment":"Add New"}</button>`)}<div class="panel"><div class="panel-head"><h3>${title}</h3><button class="text-link" data-go="ledger">Open Ledger →</button></div>${page==="stock"?`<div class="stock-list">${products.map(p=>`<div class="stock-row" style="grid-template-columns:42px 1fr 2fr 100px"><img src="${p.img}" alt=""><div class="stock-name">${p.name}</div><div class="bar"><span style="width:${Math.min(100,p.stock/Math.max(p.min*5,1)*100)}%"></span></div><div class="stock-qty">${qty(p.stock)} ${p.unit}<small>${p.stock<=p.min?"Low Stock":"In Stock"}</small></div></div>`).join("")}</div>`:transactionTable(transactions.filter(t=>page==="purchases"?t.type==="Purchase":page==="sales"?t.type==="Sale":true))}</div>`}
function render(page=activePage){activePage=page;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));const content=document.getElementById("pageContent");content.innerHTML=page==="home"?homePage():page==="products"?productsPage():page==="ledger"?ledgerPage():simplePage(page);document.getElementById("sidebar").classList.remove("open");if(page==="products")renderProductsTable();if(page==="ledger")setupLedger()}
function setupLedger(){let tab="All";document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));updateLedger()}));document.getElementById("ledgerSearch")?.addEventListener("input",updateLedger);function updateLedger(){const s=(document.getElementById("ledgerSearch")?.value||"").toLowerCase();document.getElementById("ledgerTable").innerHTML=transactionTable(transactions.filter(t=>(tab==="All"||t.type===tab)&&`${t.product} ${t.party} ${t.type}`.toLowerCase().includes(s)))}}
function openModal(kind,editIndex=null){const isProduct=kind==="product";const p=editIndex!==null?products[editIndex]:null;document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${p?"Edit Product":isProduct?"Add Product":"Add Transaction"}</h2><button class="close" id="closeModal">×</button></div><form id="entryForm"><div class="form-grid">${isProduct?`
<div class="form-field full"><label>Product name</label><input name="name" required value="${p?.name||""}" placeholder="e.g. Pepper (Black)"></div>
<div class="form-field"><label>Category</label><select name="category"><option>Arecanut</option><option>Pepper</option><option>Cashew</option><option>Coconut</option><option>Spices</option><option>Other</option></select></div>
<div class="form-field"><label>Unit</label><select name="unit"><option>kg</option><option>liter</option><option>pcs</option></select></div>
<div class="form-field"><label>Opening / current stock</label><input name="stock" type="number" min="0" step=".01" required value="${p?.stock??0}"></div>
<div class="form-field"><label>Purchase rate (₹)</label><input name="buy" type="number" min="0" step=".01" required value="${p?.buy??0}"></div>
<div class="form-field"><label>Sales rate (₹)</label><input name="sell" type="number" min="0" step=".01" required value="${p?.sell??0}"></div>
<div class="form-field"><label>Low-stock threshold</label><input name="min" type="number" min="0" step=".01" value="${p?.min??10}"></div>
`:`<div class="form-field"><label>Transaction type</label><select name="type" id="txType"><option>Purchase</option><option>Sale</option><option>Expense</option></select></div>
<div class="form-field"><label>Date</label><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div>
<div class="form-field full"><label>Product / expense description</label><select name="product" id="txProduct">${products.map(x=>`<option value="${x.name}">${x.name}</option>`).join("")}<option value="Transport">Transport / Other Expense</option></select></div>
<div class="form-field"><label>Supplier / customer</label><input name="party" placeholder="Name or business"></div>
<div class="form-field"><label>Quantity</label><input name="qty" type="number" min="0" step=".01" required value="1"></div>
<div class="form-field"><label>Unit</label><select name="unit" id="txUnit"><option>kg</option><option>liter</option><option>pcs</option></select></div>
<div class="form-field"><label>Rate (₹ per unit)</label><input name="rate" type="number" min="0" step=".01" required value="0"></div>
<div class="form-field"><label>Total amount (₹)</label><input name="amount" id="txAmount" type="number" min="0" step=".01" required value="0"></div>
`}</div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary" type="submit">Save ${isProduct?"Product":"Transaction"}</button></div></form></div></div>`;
const close=()=>document.getElementById("modalRoot").innerHTML="";document.getElementById("closeModal").onclick=close;document.getElementById("cancelModal").onclick=close;document.getElementById("backdrop").addEventListener("click",e=>{if(e.target.id==="backdrop")close()});
if(isProduct){document.querySelector(`#entryForm [name=category]`).value=p?.category||"Arecanut"}
else{const form=document.getElementById("entryForm"),prod=form.elements.product,unit=form.elements.unit,rate=form.elements.rate,amount=form.elements.amount,qtyInput=form.elements.qty;function sync(){const product=products.find(x=>x.name===prod.value);if(product){unit.value=product.unit;if(!rate.value||Number(rate.value)===0)rate.value=(form.elements.type.value==="Sale"?product.sell:product.buy)}amount.value=(Number(qtyInput.value)||0)*(Number(rate.value)||0)}prod.addEventListener("change",()=>{const product=products.find(x=>x.name===prod.value);if(product){unit.value=product.unit;rate.value=form.elements.type.value==="Sale"?product.sell:product.buy;sync()}});form.elements.type.addEventListener("change",()=>{const product=products.find(x=>x.name===prod.value);if(product)rate.value=form.elements.type.value==="Sale"?product.sell:product.buy;sync()});[qtyInput,rate].forEach(el=>el.addEventListener("input",sync));}
document.getElementById("entryForm").addEventListener("submit",e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());if(isProduct){const obj={...data,stock:Number(data.stock),buy:Number(data.buy),sell:Number(data.sell),min:Number(data.min),img:p?.img||imgs[data.category.toLowerCase()]||imgs.star};if(p)products[editIndex]=obj;else products.push(obj);render("products");toast(p?"Product updated":"Product added")}else{const product=products.find(x=>x.name===data.product);const date=data.date?new Date(data.date+"T12:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}).replace(/ /g," "):"";const tx={...data,date,type:data.type,qty:Number(data.qty),rate:Number(data.rate),amount:Number(data.amount),unit:data.unit};transactions.unshift(tx);if(product&&data.type==="Purchase")product.stock+=Number(data.qty);if(product&&data.type==="Sale")product.stock=Math.max(0,product.stock-Number(data.qty));render(activePage);toast("Transaction saved")};close()})}
function toast(msg){const el=document.createElement("div");el.className="toast";el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2500)}
document.addEventListener("click",e=>{const nav=e.target.closest("[data-page]");if(nav){render(nav.dataset.page);return}const go=e.target.closest("[data-go]");if(go){render(go.dataset.go);return}const act=e.target.closest("[data-action]");if(act){openModal(act.dataset.action==="add-product"?"product":"transaction");return}const edit=e.target.closest("[data-edit-product]");if(edit){openModal("product",Number(edit.dataset.editProduct));return}});
document.getElementById("nav").addEventListener("click",()=>{});document.getElementById("menuBtn").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){render("products");const input=document.getElementById("productSearch");if(input){input.value=e.target.value;renderProductsTable()}}});
document.addEventListener("input",e=>{if(["productSearch","categoryFilter","unitFilter","statusFilter"].includes(e.target.id))renderProductsTable()});
document.addEventListener("click",e=>{if(e.target.id==="clearFilters"){["productSearch","categoryFilter","unitFilter","statusFilter"].forEach(id=>{const x=document.getElementById(id);if(x)x.value=""});renderProductsTable()}});
render();
</script>
</body>
</html>
